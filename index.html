<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guias · Suri</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sora', sans-serif;
    background: radial-gradient(ellipse 60% 55% at 8% 0%, rgba(60,70,220,0.20) 0%, transparent 55%), #080b1e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 640px; width: 100%; }
  .kicker {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(79,86,240,0.14); border: 1px solid #2a3080;
    padding: 6px 16px; border-radius: 100px;
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px;
    color: #4f56f0; text-transform: uppercase; margin-bottom: 20px;
  }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
  p.sub { font-size: 14px; color: #8a90b8; margin-bottom: 36px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  a.card {
    background: #0e1235;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 26px 22px;
    text-decoration: none;
    color: inherit;
    display: block;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    transition: transform .2s, border-color .2s;
  }
  a.card:hover { transform: translateY(-4px); border-color: #4f56f0; }
  .icon { font-size: 26px; margin-bottom: 14px; }
  .card-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .card-desc { font-size: 12.5px; color: #8a90b8; line-height: 1.5; }
  .cta { margin-top: 16px; font-size: 12.5px; font-weight: 700; color: #b6b8ff; }
</style>
</head>
<body>
<main>
  <span class="kicker">● Suri · Materiais de apoio</span>
  <h1>Guias de Vendas</h1>
  <p class="sub">Acesse abaixo o guia da sua etapa. Conteúdo interno.</p>
  <div class="grid">
    <a class="card" href="guia-ligacao.html">
      <div class="icon">📞</div>
      <div class="card-title">Guia de Ligação</div>
      <div class="card-desc">Checklist e roteiro para condução da ligação de SDR.</div>
      <div class="cta">Abrir guia →</div>
    </a>
    <a class="card" href="guia-reuniao.html">
      <div class="icon">🤝</div>
      <div class="card-title">Guia de Reunião</div>
      <div class="card-desc">Checklist e roteiro para condução da reunião de Closer.</div>
      <div class="cta">Abrir guia →</div>
    </a>
  </div>
</main>
</body>
</html>
